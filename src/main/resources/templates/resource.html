<!doctype html>
<html
  lang="en"
  xmlns:th="http://www.thymeleaf.org"
  th:replace="~{layout :: shell(~{::section},${title})}"
>
  <section>
    <header class="page-heading">
      <div>
        <p class="section-label">Administration</p>
        <h1 th:text="${title}"></h1>
      </div>
      <a
        class="primary-action"
        th:if="${!resource.editable.isEmpty() and resource.path!='/admin/anomalies'}"
        th:href="${resource.path}+'/edit'"
        >Add record</a
      >
    </header>
    <nav class="java-tabs">
      <a
        th:if="${resource.path=='/admin/lss-plants'}"
        href="/admin/api-configurations"
        >Plant API links</a
      ><a
        th:if="${resource.path=='/admin/report-automation'}"
        href="/admin/report-recipients"
        >Recipients</a
      ><a
        th:if="${resource.path=='/admin/report-automation'}"
        href="/admin/delivery-monitor"
        >Delivery monitor</a
      ><a
        th:if="${resource.path=='/admin/data-quality'}"
        href="/admin/anomalies"
        >Data anomalies</a
      >
    </nav>
    <article class="panel">
      <form class="java-search" method="get">
        <label for="search">Search records</label
        ><input id="search" name="q" th:value="${q}" maxlength="100" /><button
          class="secondary-action"
        >
          Search</button
        ><a th:href="${resource.path}">Clear</a>
      </form>
      <div class="java-table-wrap">
        <table>
          <thead>
            <tr>
              <th>ID</th>
              <th th:each="c:${columns}" th:text="${c.label}"></th>
              <th th:if="${!resource.editable.isEmpty()}">Action</th>
            </tr>
          </thead>
          <tbody>
            <tr th:each="r:${rows}">
              <td th:text="${r.id}"></td>
              <td th:each="c:${columns}" th:text="${r[c.name]}"></td>
              <td th:if="${!resource.editable.isEmpty()}">
                <a th:href="@{${resource.path}+'/edit'(id=${r.id})}">Edit</a>
              </td>
            </tr>
            <tr th:if="${#lists.isEmpty(rows)}">
              <td colspan="12" class="java-empty">No records found.</td>
            </tr>
          </tbody>
        </table>
      </div>
      <nav class="java-pagination" aria-label="Record pages">
        <a th:if="${page>0}" th:href="@{''(page=${page-1},q=${q})}">Previous</a
        ><span th:text="'Page '+${page+1}+' · '+${total}+' records'"></span
        ><a th:if="${(page+1)*25<total}" th:href="@{''(page=${page+1},q=${q})}"
          >Next</a
        >
      </nav>
    </article>
    <article
      class="panel java-panel"
      th:if="${resource.path=='/admin/lss-plants'}"
    >
      <h2>Test a configured API</h2>
      <form
        class="java-filters"
        th:action="@{/admin/plants/0/test}"
        method="post"
        data-plant-test
      >
        <label
          >Plant ID (numeric)<input
            type="number"
            name="testPlantId"
            min="1"
            required /></label
        ><label
          >Dataset<select name="dataType">
            <option>Rolling 24 Hour</option>
            <option>Day Ahead</option>
            <option>Week Ahead</option>
            <option>4 Month Ahead</option>
            <option>MMF</option>
          </select></label
        ><button class="secondary-action">Test connection</button>
      </form>
    </article>
  </section>
</html>
