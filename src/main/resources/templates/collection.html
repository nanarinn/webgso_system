<!doctype html>
<html
  lang="en"
  xmlns:th="http://www.thymeleaf.org"
  th:replace="~{layout :: shell(~{::section},${title})}"
>
  <section>
    <header class="page-heading">
      <div>
        <p class="section-label">Collection details</p>
        <h1 th:text="${job.collectionId}"></h1>
        <p th:text="${job.dataType}+' · '+${job.status}"></p>
      </div>
      <a class="secondary-action" href="/collection-management"
        >Collection history</a
      >
    </header>
    <article class="panel">
      <h2>Outcome</h2>
      <p th:text="${job.responseMessage}"></p>
      <p
        class="page-inline-error"
        th:if="${job.errorMessage}"
        th:text="${job.errorMessage}"
      ></p>
      <dl class="java-details">
        <dt>Submission</dt>
        <dd th:text="${job.submissionDateTime}"></dd>
        <dt>Requested by</dt>
        <dd th:text="${job.requestedBy}"></dd>
        <dt>Duration</dt>
        <dd th:text="${job.durationSeconds}+' seconds'"></dd>
        <dt>Retries</dt>
        <dd th:text="${job.retryCount}"></dd>
      </dl>
    </article>
    <article class="panel java-panel">
      <h2>Detected anomalies</h2>
      <div class="java-table-wrap">
        <table>
          <thead>
            <tr>
              <th>Parameter</th>
              <th>Original value</th>
              <th>Reason</th>
              <th>Status</th>
            </tr>
          </thead>
          <tbody>
            <tr th:each="a:${anomalies}">
              <td th:text="${a.fieldName}"></td>
              <td th:text="${a.originalValue}"></td>
              <td th:text="${a.reason}"></td>
              <td th:text="${a.status}"></td>
            </tr>
          </tbody>
        </table>
      </div>
    </article>
    <details class="panel java-panel">
      <summary>Raw API response</summary>
      <article th:each="r:${raw}">
        <p th:text="'HTTP '+${r.httpStatusCode}+' · '+${r.contentType}"></p>
        <p class="java-hash" th:text="'SHA-256: '+${r.sha256}"></p>
        <pre th:text="${r.payload}"></pre>
      </article>
      <p th:if="${#lists.isEmpty(raw)}">No raw response was received.</p>
    </details>
  </section>
</html>
