<!doctype html>
<html
  lang="en"
  xmlns:th="http://www.thymeleaf.org"
  th:replace="~{layout :: shell(~{::section},${title})}"
>
  <section>
    <header class="page-heading">
      <div>
        <p class="section-label">Access control</p>
        <h1>User Management</h1>
        <p class="page-subtitle">
          Review access requests and assign approved roles.
        </p>
      </div>
    </header>
    <article class="panel">
      <div class="java-table-wrap">
        <table>
          <thead>
            <tr>
              <th>User</th>
              <th>Email</th>
              <th>Status</th>
              <th>Current role</th>
              <th>Review access</th>
            </tr>
          </thead>
          <tbody>
            <tr th:each="u:${users}">
              <td>
                <strong th:text="${u.displayName}"></strong
                ><small class="java-block" th:text="${u.userName}"></small>
              </td>
              <td th:text="${u.email}"></td>
              <td th:text="${u.accessStatus}"></td>
              <td th:text="${roles[u.id]}"></td>
              <td>
                <form
                  class="java-user-review"
                  th:if="${u.id!=account.id}"
                  th:action="@{/admin/users/{id}/review(id=${u.id})}"
                  method="post"
                >
                  <label
                    >Decision<select name="decision">
                      <option value="Approved">Approve</option>
                      <option value="Rejected">Reject</option>
                      <option value="Inactive">Deactivate</option>
                    </select></label
                  ><label
                    >Role<select name="role">
                      <option>Staff</option>
                      <option>Administrator</option>
                      <option>SuperAdministrator</option>
                    </select></label
                  ><label
                    >Review note<input name="note" maxlength="1000" /></label
                  ><button class="secondary-action">Save review</button>
                </form>
                <span th:if="${u.id==account.id}">Your account</span>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </article>
  </section>
</html>
