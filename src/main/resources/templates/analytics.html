<!doctype html>
<html
  lang="en"
  xmlns:th="http://www.thymeleaf.org"
  th:replace="~{layout :: shell(~{::section},${title})}"
>
  <section>
    <header class="page-heading">
      <div>
        <p class="section-label">Portfolio intelligence</p>
        <h1 th:text="${title}"></h1>
        <p
          class="page-subtitle"
          th:text="${mmf}?'Review meteorological measurements by plant, parameter and timestamp.':'Review forecast production across all configured DDQ horizons.'"
        ></p>
      </div>
    </header>
    <form class="panel java-filters" method="get">
      <label
        >Plant<select name="plantIds">
          <option value="">All plants</option>
          <option
            th:each="plant:${plants}"
            th:value="${plant.id}"
            th:text="${plant.plantId}+' · '+${plant.name}"
            th:selected="${plantIds==plant.id.toString()}"
          ></option></select></label
      ><label
        >State<select name="state">
          <option value="">All states</option>
          <option
            th:each="s:${states}"
            th:value="${s}"
            th:text="${s}"
            th:selected="${s==state}"
          ></option></select></label
      ><label
        >Region<select name="region">
          <option value="">All regions</option>
          <option
            th:each="r:${regions}"
            th:value="${r}"
            th:text="${r}"
            th:selected="${r==region}"
          ></option></select></label
      ><label
        >Group by<select name="scope">
          <option
            th:each="s:${#strings.arraySplit('Plant,State,Region',',')}"
            th:value="${s}"
            th:text="${s}"
            th:selected="${s==scope}"
          ></option></select></label
      ><label th:unless="${mmf}"
        >Dataset<select name="dataType">
          <option
            th:each="t:${dataTypes}"
            th:value="${t}"
            th:text="${t}"
            th:selected="${t==dataType}"
          ></option></select></label
      ><label th:if="${mmf}"
        >Parameter<select name="parameter">
          <option value="">All parameters</option>
          <option
            th:each="p:${parameters}"
            th:text="${p}"
            th:value="${p}"
            th:selected="${p==parameter}"
          ></option></select></label
      ><label
        >Data from<input
          name="from"
          type="datetime-local"
          th:value="${from}" /></label
      ><label
        >Data until (exclusive)<input
          name="to"
          type="datetime-local"
          th:value="${to}" /></label
      ><label
        >Submission (optional)<input
          name="submission"
          type="datetime-local"
          th:value="${submission}" /></label
      ><button class="primary-action">Apply filters</button>
    </form>
    <article class="panel java-panel">
      <div class="panel-heading">
        <h2 th:text="${dataType}+' trend'"></h2>
        <span th:text="${total}+' readings'"></span>
      </div>
      <div class="java-chart" th:if="${total>0}">
        <svg
          viewBox="0 0 1000 270"
          role="img"
          aria-label="Readings over the selected time range"
        >
          <path d="M40 35 V230 H965" class="chart-axis"></path>
          <text x="5" y="30" th:text="${chartMax}"></text>
          <text x="5" y="250" th:text="${chartMin}"></text>
          <polyline class="chart-series" th:attr="points=${points}"></polyline>
        </svg>
        <p
          class="page-subtitle"
          th:text="${mmf}?'Average across the selected measurements. Select one parameter when comparing units.':'Total forecast across the selected plants.'"
        ></p>
      </div>
      <p class="java-empty" th:if="${total==0}">
        No readings match these filters. Select another range or collect API
        data.
      </p>
      <div class="java-table-wrap">
        <table>
          <thead>
            <tr>
              <th>Timestamp</th>
              <th>Plant</th>
              <th>Submission</th>
              <th>Parameter</th>
              <th>Value</th>
              <th>Unit</th>
              <th>Interval</th>
            </tr>
          </thead>
          <tbody>
            <tr th:each="r:${rows}">
              <td th:text="${r.intervalStart}"></td>
              <td th:text="${plantNames[r.plantId]}"></td>
              <td th:text="${r.submissionDateTime}"></td>
              <td th:text="${r.parameter}"></td>
              <td th:text="${r.value}"></td>
              <td th:text="${r.unit}"></td>
              <td th:text="${r.intervalMinutes}+' min'"></td>
            </tr>
          </tbody>
        </table>
      </div>
      <nav class="java-pagination" aria-label="Reading pages">
        <a
          th:if="${page>0}"
          th:href="@{''(page=${page-1},plantIds=${plantIds},dataType=${dataType},from=${from},to=${to},submission=${submission},parameter=${parameter},state=${state},region=${region},scope=${scope})}"
          >Previous</a
        ><span th:text="'Page '+${page+1}"></span
        ><a
          th:if="${(page+1)*25<total}"
          th:href="@{''(page=${page+1},plantIds=${plantIds},dataType=${dataType},from=${from},to=${to},submission=${submission},parameter=${parameter},state=${state},region=${region},scope=${scope})}"
          >Next</a
        >
      </nav>
    </article>
  </section>
</html>
