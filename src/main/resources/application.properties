spring.application.name=webgso-system
server.address=${WEBGSO_ADDRESS:127.0.0.1}
server.port=${PORT:5186}
server.servlet.session.timeout=15m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${WEBGSO_SECURE_COOKIE:false}
spring.datasource.url=${WEBGSO_DB_URL:jdbc:postgresql://localhost:5432/webgso_system}
spring.datasource.username=${WEBGSO_DB_USER:webgso_app}
spring.datasource.password=${WEBGSO_DB_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=10
spring.sql.init.mode=never
spring.thymeleaf.cache=true
server.error.include-message=never
server.error.include-stacktrace=never
webgso.schema.initialize=false
webgso.workers.enabled=${WEBGSO_WORKERS_ENABLED:false}
webgso.api.allow-private-hosts=${WEBGSO_API_PRIVATE_HOSTS:}
webgso.api.allow-http-hosts=${WEBGSO_API_HTTP_HOSTS:}
webgso.api.maximum-bytes=10485760
webgso.bootstrap.username=${WEBGSO_ADMIN_USERNAME:}
webgso.bootstrap.email=${WEBGSO_ADMIN_EMAIL:}
webgso.bootstrap.password=${WEBGSO_ADMIN_PASSWORD:}
webgso.mail.enabled=${WEBGSO_MAIL_ENABLED:false}
webgso.mail.from=${WEBGSO_MAIL_FROM:}
spring.mail.host=${SMTP_HOST:localhost}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
