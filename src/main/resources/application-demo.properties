spring.datasource.url=jdbc:h2:mem:webgso;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_UPPER=false
spring.datasource.username=sa
spring.datasource.password=
webgso.schema.initialize=true
webgso.workers.enabled=false
webgso.bootstrap.username=${WEBGSO_ADMIN_USERNAME:demo.admin}
webgso.bootstrap.email=${WEBGSO_ADMIN_EMAIL:demo.admin@example.test}
webgso.bootstrap.password=${WEBGSO_ADMIN_PASSWORD:DemoAdmin123!}
